# Publish the film to GitHub Pages, so it lives at a real URL you can link or
# iframe into a personal site.
#
# Copy to .github/workflows/sediment-pages.yml.
#
# One manual step first: Settings -> Pages -> Source -> "GitHub Actions". The
# workflow token can create Pages *deployments* but is not allowed to change
# that setting, so it cannot do this for you — a run against a repository still
# set to "Deploy from a branch" fails with a 404 from deploy-pages.
#
name: Sediment (Pages)

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/configure-pages@v5
      - uses: iLevyTate/sediment@main
        with:
          output: _site
          gif: 'true'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
