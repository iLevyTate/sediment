# Keep a live history film for your repository.
#
# Copy to .github/workflows/sediment.yml. It force-pushes the results to a
# `sediment` branch, which gives you stable URLs to link from your README:
#
#   ![history](https://raw.githubusercontent.com/OWNER/REPO/sediment/sediment.gif)
#
# The branch also carries sediment.mp4 and an interactive index.html, so you can
# link those instead, or point GitHub Pages at the branch to host the page.
#
name: Sediment

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays, 06:00 UTC
  workflow_dispatch:
  # Rendering takes a few minutes because it installs a headless browser and
  # ffmpeg, so this deliberately does not run on every push. Uncomment if you
  # want the film to track the default branch commit by commit.
  # push:
  #   branches: [main]

permissions:
  contents: write

concurrency:
  group: sediment
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # sediment needs the whole history, not a shallow clone
      - uses: iLevyTate/sediment@main
        with:
          gif: 'true' # implies video; the gif is derived from the mp4
          gif-width: '760'
          publish-branch: sediment
