<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img"
  aria-label="Sediment. Turn any git repository's history into a stratigraphic film.">
  <!--
    The README hero. One file serves both themes: the palette flips on
    prefers-color-scheme, and the type is a subset of IBM Plex embedded as
    data URIs, 4 KB for both faces, with system fallbacks behind it.
    Generated by hand for this repository; the wedge is the same section the
    site draws while the demo payload downloads.
  -->
  <style>
    svg {
      --ground: #fbfbfd; --ink: #14171f; --ink-2: #4b5364; --muted: #79808f;
      --line: #d2d6e0; --accent: #1f6f78;
      --l0: #7ea465; --l1: #a14a30; --l2: #3e7ca8; --l3: #b47f22;
      --l4: #32939a; --l5: #666f7f; --l6: #719353; --l7: #787836;
      --strata-alpha: 0.62;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --ground: #0f1218; --ink: #e9ecf3; --ink-2: #a8b0be; --muted: #6f7787;
        --line: #232833; --accent: #5cb8bf;
        --l0: #a1bf8d; --l1: #cb6748; --l2: #609cc7; --l3: #dda23c;
        --l4: #48bec7; --l5: #868fa2; --l6: #92b474; --l7: #a8a848;
        --strata-alpha: 0.5;
      }
    }
    @font-face {
      font-family: 'PlexCondSub';
      src: url(data:font/woff2;base64,) format('woff2');
      font-weight: 700;
    }
    @font-face {
      font-family: 'PlexMonoSub';
      src: url(data:font/woff2;base64,) format('woff2');
    }
    .wordmark {
      font: 700 68px 'PlexCondSub', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
      letter-spacing: -1px;
    }
    .tagline {
      font: 16px 'PlexMonoSub', 'Courier New', monospace;
      fill: var(--ink-2);
    }
    .axis {
      font: 12px 'PlexMonoSub', 'Courier New', monospace;
      fill: var(--muted);
      letter-spacing: 1px;
    }
  </style>
